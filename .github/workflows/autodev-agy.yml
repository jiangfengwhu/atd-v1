name: AutoDev AGY Coding Runner

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: 'Target Draft PR branch containing docs/spec.json and read-only E2E test suite'
        required: true
        type: string
      pr_number:
        description: 'Draft PR number (optional, used for status comment)'
        required: false
        default: ''
        type: string
      run_id:
        description: 'AutoDev Studio Run ID'
        required: false
        default: ''
        type: string
      e2e_test_path:
        description: 'Read-only E2E test path for this iteration (defaults to spec.json or tests/e2e.spec.ts)'
        required: false
        default: ''
        type: string
      revision_note:
        description: 'Optional approval rework instructions when re-running after changes_requested'
        required: false
        default: ''
        type: string
      agy_model:
        description: 'AGY model ID configured on the VPS'
        required: false
        default: 'gemini-3.8-flash-high'
        type: choice
        options:
          - gemini-3.8-flash-high
          - gemini-3.8-flash-medium
          - claude-sonnet-4-6
          - claude-opus-4-6-thinking
          - gpt-oss-120b-medium
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Single-task repository-wide serial queue to guarantee fresh context across iterations
concurrency:
  group: autodev-agy-single-queue
  cancel-in-progress: false

jobs:
  agy-implement:
    # Security guard: only allow repo owner to trigger execution on the VPS self-hosted runner
    if: >-
      github.actor == 'jiangfengwhu' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.label.name == 'autodev:run'))
    runs-on: [self-hosted, linux, x64, vps-agy]
    timeout-minutes: 30

    steps:
      - name: Resolve Target Branch
        id: target
        shell: bash
        run: |
          BRANCH="${{ inputs.pr_branch || github.head_ref }}"
          MODEL="${{ inputs.agy_model || 'gemini-3.8-flash-high' }}"
          PR_NUM="${{ inputs.pr_number || github.event.pull_request.number || '' }}"
          E2E_PATH="${{ inputs.e2e_test_path || '' }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "e2e_test_path=${E2E_PATH}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Verify VPS AGY CLI, Workspace Directory & Lock All Read-Only E2E Contracts
        id: lock
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
          echo "Workspace CWD: $(pwd)"
          ls -la
          which agy
          agy --version

          LOCK_MANIFEST="/tmp/autodev-e2e-lock-${{ github.run_id }}.sha256"
          : > "${LOCK_MANIFEST}"
          if [ -f "tests/e2e.spec.ts" ]; then
            sha256sum "tests/e2e.spec.ts" >> "${LOCK_MANIFEST}"
          fi
          if [ -d "tests/e2e" ]; then
            find tests/e2e -type f -name '*.spec.ts' | sort | while read -r f; do
              sha256sum "${f}" >> "${LOCK_MANIFEST}"
            done
          fi
          if [ -f "docs/spec.json" ]; then
            sha256sum "docs/spec.json" >> "${LOCK_MANIFEST}"
          fi
          echo "lock_manifest=${LOCK_MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "Locked read-only contract files:"
          cat "${LOCK_MANIFEST}" || true

      - name: Execute AGY Coding Agent on VPS (Incremental Iteration + Live Log Stream)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_REPO: ${{ github.repository }}
          LIVE_RUN_ID: ${{ github.run_id }}
          LIVE_BRANCH: ${{ steps.target.outputs.branch }}
          LIVE_MODEL: ${{ steps.target.outputs.model }}
          REVISION_NOTE: ${{ inputs.revision_note }}
          ACTIVE_E2E_PATH: ${{ steps.target.outputs.e2e_test_path }}
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
          LOG_FILE="/tmp/autodev-agy-${LIVE_RUN_ID}.log"
          : > "${LOG_FILE}"

          cat > /tmp/autodev-live-reporter.mjs <<'REPORTER_EOF'
          import fs from 'fs';
          import { execSync } from 'child_process';

          const token = process.env.GH_TOKEN;
          const repo = process.env.LIVE_REPO;
          const runId = process.env.LIVE_RUN_ID;
          const branch = process.env.LIVE_BRANCH;
          const model = process.env.LIVE_MODEL;
          const logFile = process.env.LOG_FILE;
          const issueTitle = '[AutoDev] Live AGY Execution Stream';
          const marker = '<!-- AUTODEV-LIVE-LOG:' + runId + ' -->';
          const startedAt = Date.now();
          let issueNumber = null;
          let issueCommentCount = 0;
          let commentId = null;

          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };

          async function gh(path, options = {}) {
            const res = await fetch('https://api.github.com' + path, { ...options, headers });
            if (!res.ok) return null;
            return res.json().catch(() => null);
          }

          async function ensureIssue() {
            if (issueNumber) return issueNumber;
            const issues = await gh('/repos/' + repo + '/issues?state=open&per_page=30');
            if (Array.isArray(issues)) {
              const found = issues.find((i) => !i.pull_request && i.title === issueTitle);
              if (found) {
                issueNumber = found.number;
                issueCommentCount = Number(found.comments || 0);
                return issueNumber;
              }
            }
            const created = await gh('/repos/' + repo + '/issues', {
              method: 'POST',
              body: JSON.stringify({
                title: issueTitle,
                body: 'AutoDev Studio 实时 AGY 执行日志流（系统自动维护，请勿手动删除）。',
              }),
            });
            if (created && created.number) {
              issueNumber = created.number;
              issueCommentCount = 0;
            }
            return issueNumber;
          }

          function buildBody(stateLabel) {
            const elapsedSec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
            let gitStatus = '';
            try {
              gitStatus = execSync('git status --short', { encoding: 'utf8' }).trim();
            } catch {}
            let logText = '';
            try {
              const raw = fs.readFileSync(logFile, 'utf8');
              const clean = raw
                .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
                .replace(/\r/g, '')
                .replace(/~~~~/g, '----');
              logText = clean.split('\n').slice(-100).join('\n').slice(-24000);
            } catch {}
            const filesSection = (gitStatus || '(尚未产生文件变更，AGY 正在阅读需求并规划实现…)').replace(/~~~~/g, '----');
            const outputSection = logText.trim() || '(AGY 已启动，正在分析现有仓库代码、docs/prd.md、docs/spec.json 与只读测试集…)';
            return [
              marker,
              '### AutoDev VPS AGY Live Stream',
              '- Status: ' + stateLabel,
              '- Run ID: ' + runId,
              '- Branch: ' + branch,
              '- Model: ' + model,
              '- Workspace: ' + process.cwd(),
              '- Elapsed: ' + elapsedSec + 's',
              '- Updated: ' + new Date().toISOString(),
              '',
              '#### Changed Files (git status --short)',
              '~~~~text',
              filesSection,
              '~~~~',
              '',
              '#### Live AGY Output',
              '~~~~text',
              outputSection,
              '~~~~',
            ].join('\n');
          }

          async function syncOnce(stateLabel) {
            if (!token || !repo) return;
            const num = await ensureIssue();
            if (!num) return;
            const body = buildBody(stateLabel);
            if (!commentId) {
              const lastPage = Math.max(1, Math.ceil((issueCommentCount || 1) / 100));
              const pagesToCheck = lastPage > 1 ? [lastPage, lastPage - 1] : [1];
              for (const page of pagesToCheck) {
                const comments = await gh('/repos/' + repo + '/issues/' + num + '/comments?per_page=100&page=' + page);
                if (Array.isArray(comments)) {
                  const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(marker));
                  if (existing) {
                    commentId = existing.id;
                    break;
                  }
                }
              }
            }
            if (commentId) {
              await gh('/repos/' + repo + '/issues/comments/' + commentId, {
                method: 'PATCH',
                body: JSON.stringify({ body }),
              });
            } else {
              const created = await gh('/repos/' + repo + '/issues/' + num + '/comments', {
                method: 'POST',
                body: JSON.stringify({ body }),
              });
              if (created && created.id) {
                commentId = created.id;
                issueCommentCount += 1;
              }
            }
          }

          if (process.argv.includes('--final')) {
            const codeIdx = process.argv.indexOf('--final') + 1;
            const exitCode = process.argv[codeIdx] || '0';
            await syncOnce(exitCode === '0' ? 'COMPLETED (exit 0)' : 'FAILED (exit ' + exitCode + ')');
            process.exit(0);
          }

          await syncOnce('RUNNING');
          setInterval(() => {
            syncOnce('RUNNING').catch(() => {});
          }, 8000);
          REPORTER_EOF

          export LOG_FILE
          node /tmp/autodev-live-reporter.mjs &
          REPORTER_PID=$!

          REVISION_SECTION=""
          if [ -f "docs/revision-feedback.md" ] || [ -n "${REVISION_NOTE}" ]; then
            REVISION_SECTION="CRITICAL REWORK MODE: This PR was returned with review feedback. Read docs/revision-feedback.md thoroughly (if present) and prioritize resolving EVERY requested fix below before finishing: ${REVISION_NOTE}"
          fi

          PROMPT=$(cat <<EOF
          You are executing inside an AutoDev Studio automated engineering pipeline on branch ${LIVE_BRANCH}.
          Current working directory is the root of this repository.
          Read docs/prd.md, docs/spec.json, any docs/revision-feedback.md, and all read-only Playwright E2E tests under tests/e2e/ (and tests/e2e.spec.ts if present) thoroughly.
          ${REVISION_SECTION}

          Requirements:
          1. INCREMENTAL ITERATION RULE: Inspect the existing codebase first. Preserve all previously working features, existing API contracts, and historical regression tests under tests/e2e/. Do NOT rewrite unrelated working modules from scratch unless strictly required by docs/spec.json.
          2. Implement all atomic tasks and API contracts defined in docs/spec.json in clean, modular, production-ready code.
          3. Cloudflare Deployment & D1 Migration Standard (when targeting Cloudflare Workers):
             - Maintain a valid wrangler.toml (or wrangler.jsonc) with Workers Static Assets ([assets] directory = "./dist", not_found_handling = "single-page-application"), Hono TypeScript API entry, and D1 SQL migrations in migrations/.
             - NEVER modify or overwrite already-applied migration files in migrations/. Always append new sequentially numbered migration files (e.g. 0002_xxx.sql) using IF NOT EXISTS / safe ALTER statements where appropriate.
             - Ensure package.json has working build and deploy (wrangler deploy) scripts.
          4. STRICT READ-ONLY CONTRACT: Do NOT modify, weaken, or delete docs/spec.json, tests/e2e.spec.ts, or ANY file inside tests/e2e/.
          5. Install required dependencies, verify TypeScript/build passes, and run automated checks against your implementation.
          6. Keep git working tree clean of temporary logs or build artifacts (update .gitignore as needed).
          7. Output a concise summary in Chinese of implemented/modified files and verification results.
          EOF
          )

          set +e
          if command -v stdbuf >/dev/null 2>&1; then
            stdbuf -oL -eL agy \
              --mode auto \
              --dangerously-skip-permissions \
              --model "${LIVE_MODEL}" \
              --print-timeout 20m \
              --print="${PROMPT}" 2>&1 | tee "${LOG_FILE}"
            AGY_EXIT=${PIPESTATUS[0]}
          else
            agy \
              --mode auto \
              --dangerously-skip-permissions \
              --model "${LIVE_MODEL}" \
              --print-timeout 20m \
              --print="${PROMPT}" 2>&1 | tee "${LOG_FILE}"
            AGY_EXIT=${PIPESTATUS[0]}
          fi
          set -e

          kill "${REPORTER_PID}" 2>/dev/null || true
          node /tmp/autodev-live-reporter.mjs --final "${AGY_EXIT}" || true
          rm -f /tmp/autodev-live-reporter.mjs "${LOG_FILE}"
          exit "${AGY_EXIT}"

      - name: Enforce Read-Only E2E Test & Spec Contract Integrity
        shell: bash
        run: |
          LOCK_MANIFEST="${{ steps.lock.outputs.lock_manifest }}"
          if [ -s "${LOCK_MANIFEST}" ]; then
            if ! sha256sum -c "${LOCK_MANIFEST}"; then
              echo "::error::One or more read-only test/spec contract files were modified or deleted by coding agent! Reverting and failing gate."
              git checkout -- docs/spec.json tests/e2e.spec.ts tests/e2e 2>/dev/null || true
              rm -f "${LOCK_MANIFEST}"
              exit 1
            fi
            echo "Read-only contract verified: all locked E2E tests and docs/spec.json are unchanged."
          fi
          rm -f "${LOCK_MANIFEST}"

      - name: Commit & Push Implementation to Draft PR Branch
        id: push
        shell: bash
        run: |
          git config user.name "AutoDev AGY Runner"
          git config user.email "autodev-runner@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes produced by AGY."
          else
            git commit -m "feat(autodev): implement spec via VPS AGY (${{ steps.target.outputs.model }})"
            git push origin "HEAD:${{ steps.target.outputs.branch }}"
            SHA=$(git rev-parse --short HEAD)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Summary Comment on Draft PR
        if: steps.target.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ steps.push.outputs.changed }}" = "true" ]; then
            cat > /tmp/autodev-pr-summary.md <<'COMMENT_EOF'
          ### AutoDev VPS AGY 执行完成
          - Model: `${{ steps.target.outputs.model }}`
          - Commit: `${{ steps.push.outputs.commit_sha }}`
          - 全量只读测试契约（含历次回归测试）完整性校验通过。
          - 请前往 AutoDev Studio「4. 验收与上线审批」点击「一键部署隔离预览环境」进行在线验收。
          COMMENT_EOF
          else
            cat > /tmp/autodev-pr-summary.md <<'COMMENT_EOF'
          ### AutoDev VPS AGY 执行结束
          - Model: `${{ steps.target.outputs.model }}`
          - 本次执行未产生新的文件变更，请查看 Actions 日志。
          COMMENT_EOF
          fi
          gh pr comment "${{ steps.target.outputs.pr_number }}" --body-file /tmp/autodev-pr-summary.md || true
          rm -f /tmp/autodev-pr-summary.md
