name: AutoDev AGY Coding Runner

on:
  workflow_dispatch:
    inputs:
      pr_branch:
        description: 'Target Draft PR branch containing docs/spec.json and read-only E2E test suite'
        required: true
        type: string
      pr_number:
        description: 'Draft PR number (optional, used for status comment)'
        required: false
        default: ''
        type: string
      run_id:
        description: 'AutoDev Studio Run ID'
        required: false
        default: ''
        type: string
      e2e_test_path:
        description: 'Read-only E2E test path for this iteration (defaults to spec.json or tests/e2e.spec.ts)'
        required: false
        default: ''
        type: string
      revision_note:
        description: 'Optional approval rework instructions when re-running after changes_requested'
        required: false
        default: ''
        type: string
      agy_model:
        description: 'AGY model ID configured on the VPS'
        required: false
        default: 'gemini-3.8-flash-high'
        type: choice
        options:
          - gemini-3.8-flash-high
          - gemini-3.8-flash-medium
          - claude-sonnet-4-6
          - claude-opus-4-6-thinking
          - gpt-oss-120b-medium
      session_mode:
        description: 'Conditional AGY session policy: fresh or resume'
        required: false
        default: 'fresh'
        type: string
      resume_session_id:
        description: 'Optional previous clean AGY session ID to resume on rework'
        required: false
        default: ''
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Single-task repository-wide serial queue to guarantee fresh context across iterations
concurrency:
  group: autodev-agy-single-queue
  cancel-in-progress: false

jobs:
  agy-implement:
    # Security guard: only allow repo owner to trigger execution on the VPS self-hosted runner
    if: >-
      github.actor == 'jiangfengwhu' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.label.name == 'autodev:run'))
    runs-on: [self-hosted, linux, x64, vps-agy]
    timeout-minutes: 30

    steps:
      - name: Resolve Target Branch
        id: target
        shell: bash
        run: |
          BRANCH="${{ inputs.pr_branch || github.head_ref }}"
          MODEL="${{ inputs.agy_model || 'gemini-3.8-flash-high' }}"
          PR_NUM="${{ inputs.pr_number || github.event.pull_request.number || '' }}"
          E2E_PATH="${{ inputs.e2e_test_path || '' }}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"
          echo "e2e_test_path=${E2E_PATH}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Verify VPS AGY CLI, Workspace Directory & Lock All Read-Only E2E Contracts
        id: lock
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
          echo "Workspace CWD: $(pwd)"
          ls -la
          which agy
          agy --version

          LOCK_MANIFEST="/tmp/autodev-e2e-lock-${{ github.run_id }}.sha256"
          : > "${LOCK_MANIFEST}"
          if [ -f "tests/e2e.spec.ts" ]; then
            sha256sum "tests/e2e.spec.ts" >> "${LOCK_MANIFEST}"
          fi
          if [ -d "tests/e2e" ]; then
            find tests/e2e -type f -name '*.spec.ts' | sort | while read -r f; do
              sha256sum "${f}" >> "${LOCK_MANIFEST}"
            done
          fi
          if [ -f "docs/spec.json" ]; then
            sha256sum "docs/spec.json" >> "${LOCK_MANIFEST}"
          fi
          echo "lock_manifest=${LOCK_MANIFEST}" >> "$GITHUB_OUTPUT"
          echo "Locked read-only contract files:"
          cat "${LOCK_MANIFEST}" || true

      - name: Execute AGY Coding Agent on VPS (Incremental Iteration + Live Log Stream)
        id: agy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_REPO: ${{ github.repository }}
          LIVE_RUN_ID: ${{ github.run_id }}
          LIVE_BRANCH: ${{ steps.target.outputs.branch }}
          LIVE_MODEL: ${{ steps.target.outputs.model }}
          REVISION_NOTE: ${{ inputs.revision_note }}
          ACTIVE_E2E_PATH: ${{ steps.target.outputs.e2e_test_path }}
          SESSION_MODE: ${{ inputs.session_mode || 'fresh' }}
          RESUME_SESSION_ID: ${{ inputs.resume_session_id || '' }}
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: 'never'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin"
          LOG_FILE="/tmp/autodev-agy-${LIVE_RUN_ID}.log"
          : > "${LOG_FILE}"

          cat > /tmp/autodev-live-reporter.mjs <<'REPORTER_EOF'
          import fs from 'fs';
          import { execSync } from 'child_process';

          const token = process.env.GH_TOKEN;
          const repo = process.env.LIVE_REPO;
          const runId = process.env.LIVE_RUN_ID;
          const branch = process.env.LIVE_BRANCH;
          const model = process.env.LIVE_MODEL;
          const logFile = process.env.LOG_FILE;
          const issueTitle = '[AutoDev] Live AGY Execution Stream';
          const marker = '<!-- AUTODEV-LIVE-LOG:' + runId + ' -->';
          const startedAt = Date.now();
          let issueNumber = null;
          let issueCommentCount = 0;
          let commentId = null;

          const headers = {
            Authorization: 'Bearer ' + token,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };

          async function gh(path, options = {}) {
            const res = await fetch('https://api.github.com' + path, { ...options, headers });
            if (!res.ok) return null;
            return res.json().catch(() => null);
          }

          async function ensureIssue() {
            if (issueNumber) return issueNumber;
            const issues = await gh('/repos/' + repo + '/issues?state=open&per_page=30');
            if (Array.isArray(issues)) {
              const found = issues.find((i) => !i.pull_request && i.title === issueTitle);
              if (found) {
                issueNumber = found.number;
                issueCommentCount = Number(found.comments || 0);
                return issueNumber;
              }
            }
            const created = await gh('/repos/' + repo + '/issues', {
              method: 'POST',
              body: JSON.stringify({
                title: issueTitle,
                body: 'AutoDev Studio 实时 AGY 执行日志流（系统自动维护，请勿手动删除）。',
              }),
            });
            if (created && created.number) {
              issueNumber = created.number;
              issueCommentCount = 0;
            }
            return issueNumber;
          }

          function buildBody(stateLabel) {
            const elapsedSec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
            let gitStatus = '';
            try {
              gitStatus = execSync('git status --short', { encoding: 'utf8' }).trim();
            } catch {}
            let logText = '';
            try {
              const raw = fs.readFileSync(logFile, 'utf8');
              const clean = raw
                .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
                .replace(/\r/g, '')
                .replace(/~~~~/g, '----');
              logText = clean.split('\n').slice(-100).join('\n').slice(-24000);
            } catch {}
            const filesSection = (gitStatus || '(尚未产生文件变更，AGY 正在阅读需求并规划实现…)').replace(/~~~~/g, '----');
            const outputSection = logText.trim() || '(AGY 已启动，正在分析现有仓库代码、docs/prd.md、docs/spec.json 与只读测试集…)';
            return [
              marker,
              '### AutoDev VPS AGY Live Stream',
              '- Status: ' + stateLabel,
              '- Run ID: ' + runId,
              '- Branch: ' + branch,
              '- Model: ' + model,
              '- Workspace: ' + process.cwd(),
              '- Elapsed: ' + elapsedSec + 's',
              '- Updated: ' + new Date().toISOString(),
              '',
              '#### Changed Files (git status --short)',
              '~~~~text',
              filesSection,
              '~~~~',
              '',
              '#### Live AGY Output',
              '~~~~text',
              outputSection,
              '~~~~',
            ].join('\n');
          }

          async function syncOnce(stateLabel) {
            if (!token || !repo) return;
            const num = await ensureIssue();
            if (!num) return;
            const body = buildBody(stateLabel);
            if (!commentId) {
              const lastPage = Math.max(1, Math.ceil((issueCommentCount || 1) / 100));
              const pagesToCheck = lastPage > 1 ? [lastPage, lastPage - 1] : [1];
              for (const page of pagesToCheck) {
                const comments = await gh('/repos/' + repo + '/issues/' + num + '/comments?per_page=100&page=' + page);
                if (Array.isArray(comments)) {
                  const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(marker));
                  if (existing) {
                    commentId = existing.id;
                    break;
                  }
                }
              }
            }
            if (commentId) {
              await gh('/repos/' + repo + '/issues/comments/' + commentId, {
                method: 'PATCH',
                body: JSON.stringify({ body }),
              });
            } else {
              const created = await gh('/repos/' + repo + '/issues/' + num + '/comments', {
                method: 'POST',
                body: JSON.stringify({ body }),
              });
              if (created && created.id) {
                commentId = created.id;
                issueCommentCount += 1;
              }
            }
          }

          if (process.argv.includes('--final')) {
            const codeIdx = process.argv.indexOf('--final') + 1;
            const exitCode = process.argv[codeIdx] || '0';
            await syncOnce(exitCode === '0' ? 'COMPLETED (exit 0)' : 'FAILED (exit ' + exitCode + ')');
            process.exit(0);
          }

          await syncOnce('RUNNING');
          setInterval(() => {
            syncOnce('RUNNING').catch(() => {});
          }, 8000);
          REPORTER_EOF

          export LOG_FILE
          node /tmp/autodev-live-reporter.mjs &
          REPORTER_PID=$!

          REVISION_SECTION=""
          if [ -f "docs/revision-feedback.md" ] || [ -n "${REVISION_NOTE}" ]; then
            REVISION_SECTION="CRITICAL REWORK MODE: This PR was returned with review feedback. Read docs/revision-feedback.md thoroughly (if present) and prioritize resolving EVERY requested fix below before finishing: ${REVISION_NOTE}"
          fi

          PROMPT=$(cat <<EOF
          You are executing inside an AutoDev Studio automated engineering pipeline on branch ${LIVE_BRANCH}.
          Current working directory is the root of this repository.
          Read docs/prd.md, docs/spec.json, docs/rsi-guidelines.md (if present), any docs/revision-feedback.md, and all read-only Playwright E2E tests under tests/e2e/ (and tests/e2e.spec.ts if present) thoroughly.
          ${REVISION_SECTION}

          Requirements:
          1. INCREMENTAL ITERATION RULE: Inspect the existing codebase first. Preserve all previously working features, existing API contracts, and historical regression tests under tests/e2e/. Do NOT rewrite unrelated working modules from scratch unless strictly required by docs/spec.json.
          2. RSI GUARDRAILS: If docs/rsi-guidelines.md exists, treat every rule inside it as a hard engineering guardrail learned from past failures and acceptance rejections.
          3. Implement all atomic tasks and API contracts defined in docs/spec.json in clean, modular, production-ready code.
          4. Cloudflare Deployment & D1 Migration Standard (when targeting Cloudflare Workers):
             - Maintain a valid wrangler.toml (or wrangler.jsonc) with Workers Static Assets ([assets] directory = "./dist", not_found_handling = "single-page-application"), Hono TypeScript API entry, and D1 SQL migrations in migrations/.
             - NEVER modify or overwrite already-applied migration files in migrations/. Always append new sequentially numbered migration files (e.g. 0002_xxx.sql) using IF NOT EXISTS / safe ALTER statements where appropriate.
             - Ensure package.json has working build and deploy (wrangler deploy) scripts.
          5. STRICT READ-ONLY CONTRACT: Do NOT modify, weaken, or delete docs/spec.json, tests/e2e.spec.ts, or ANY file inside tests/e2e/.
          6. FOREGROUND-ONLY VERIFICATION (NO BACKGROUND TASKS & FAST CLEAN EXIT):
             - NEVER start dev servers, watch processes, or Playwright runs as async background tasks or detached daemons (doing so leaves AGY idle waiting 20m for background tasks until DEADLINE_EXCEEDED / print_timeout).
             - Always run build/typecheck and Playwright strictly in the FOREGROUND with `CI=true PLAYWRIGHT_HTML_OPEN=never` and finite timeouts, e.g. `CI=true timeout 120s npx playwright test --reporter=line`.
             - Do NOT enter redundant verification loops: once `npm run build` and a single foreground Playwright check pass, STOP IMMEDIATELY and output your concise Chinese summary so the turn finishes well within timeout. Step 7 will automatically run the full verification suite right after you exit.
          7. Keep git working tree clean of temporary logs or build artifacts (update .gitignore as needed).
          8. Output a concise summary in Chinese of implemented/modified files and verification results.
          EOF
          )

          AGY_HELP="$(agy --help 2>&1 || true)"
          USE_RESUME="false"
          RESUME_ARGS=()
          if [ "${SESSION_MODE}" = "resume" ] && [ -n "${RESUME_SESSION_ID}" ]; then
            if echo "${AGY_HELP}" | grep -q -- "--resume"; then
              USE_RESUME="true"
              RESUME_ARGS=(--resume "${RESUME_SESSION_ID}")
              echo "[AutoDev] Conditional session reuse enabled: resuming AGY session ${RESUME_SESSION_ID}" | tee -a "${LOG_FILE}"
            else
              echo "[AutoDev] VPS agy CLI does not expose --resume; starting fresh session on branch ${LIVE_BRANCH}" | tee -a "${LOG_FILE}"
            fi
          fi

          run_agy_cmd() {
            if command -v stdbuf >/dev/null 2>&1; then
              CI=true PLAYWRIGHT_HTML_OPEN=never stdbuf -oL -eL agy \
                --mode auto \
                --dangerously-skip-permissions \
                --model "${LIVE_MODEL}" \
                --print-timeout 20m \
                "$@" \
                --print="${PROMPT}" </dev/null 2>&1 | tee -a "${LOG_FILE}"
              return ${PIPESTATUS[0]}
            else
              CI=true PLAYWRIGHT_HTML_OPEN=never agy \
                --mode auto \
                --dangerously-skip-permissions \
                --model "${LIVE_MODEL}" \
                --print-timeout 20m \
                "$@" \
                --print="${PROMPT}" </dev/null 2>&1 | tee -a "${LOG_FILE}"
              return ${PIPESTATUS[0]}
            fi
          }

          set +e
          AGY_START_TS=$(date +%s)
          if [ "${USE_RESUME}" = "true" ]; then
            run_agy_cmd "${RESUME_ARGS[@]}"
            AGY_EXIT=$?
            AGY_ELAPSED=$(( $(date +%s) - AGY_START_TS ))
            if [ "${AGY_EXIT}" -ne 0 ] && [ "${AGY_ELAPSED}" -lt 45 ]; then
              echo "[AutoDev] Resuming session ${RESUME_SESSION_ID} failed quickly (exit ${AGY_EXIT}); falling back to a clean fresh AGY session." | tee -a "${LOG_FILE}"
              USE_RESUME="false"
              run_agy_cmd
              AGY_EXIT=$?
            fi
          else
            run_agy_cmd
            AGY_EXIT=$?
          fi
          set -e

          CAPTURED_SESSION_ID="$(grep -oE '(session[_ -]?id|sessionId|session)[[:space:]:=]+([A-Za-z0-9_-]{8,64})' "${LOG_FILE}" | tail -n 1 | awk -F'[:= ]+' '{print $NF}' || true)"
          if [ -z "${CAPTURED_SESSION_ID}" ] && [ "${USE_RESUME}" = "true" ]; then
            CAPTURED_SESSION_ID="${RESUME_SESSION_ID}"
          fi

          HAS_CHANGES="false"
          if [ -n "$(git status --porcelain)" ]; then
            HAS_CHANGES="true"
          fi

          echo "agy_exit=${AGY_EXIT}" >> "$GITHUB_OUTPUT"
          echo "has_changes=${HAS_CHANGES}" >> "$GITHUB_OUTPUT"
          echo "agy_session_id=${CAPTURED_SESSION_ID}" >> "$GITHUB_OUTPUT"
          echo "agy_session_reused=${USE_RESUME}" >> "$GITHUB_OUTPUT"

          kill "${REPORTER_PID}" 2>/dev/null || true
          node /tmp/autodev-live-reporter.mjs --final "${AGY_EXIT}" || true
          rm -f /tmp/autodev-live-reporter.mjs "${LOG_FILE}"

          if [ "${AGY_EXIT}" -eq 3 ] && [ "${HAS_CHANGES}" = "true" ]; then
            echo "::warning::AGY hit print_timeout (exit 3) after modifying files. Proceeding to read-only contract & full automated test verification gate instead of discarding completed code."
            exit 0
          fi
          exit "${AGY_EXIT}"

      - name: Enforce Read-Only E2E Test & Spec Contract Integrity
        shell: bash
        run: |
          LOCK_MANIFEST="${{ steps.lock.outputs.lock_manifest }}"
          if [ -s "${LOCK_MANIFEST}" ]; then
            if ! sha256sum -c "${LOCK_MANIFEST}"; then
              echo "::error::One or more read-only test/spec contract files were modified or deleted by coding agent! Reverting and failing gate."
              git checkout -- docs/spec.json tests/e2e.spec.ts tests/e2e 2>/dev/null || true
              rm -f "${LOCK_MANIFEST}"
              exit 1
            fi
            echo "Read-only contract verified: all locked E2E tests and docs/spec.json are unchanged."
          fi
          rm -f "${LOCK_MANIFEST}"

      - name: Run Automated Test Verification & Publish Structured Report
        id: verify
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPO: ${{ github.repository }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_BRANCH: ${{ steps.target.outputs.branch }}
          REPORT_PR_NUM: ${{ steps.target.outputs.pr_number }}
          REPORT_PIPELINE_ID: ${{ inputs.run_id }}
          REPORT_CHANNEL_BRANCH: 'autodev-plan-channel'
          REPORT_AGY_EXIT: ${{ steps.agy.outputs.agy_exit }}
          REPORT_AGY_SESSION_ID: ${{ steps.agy.outputs.agy_session_id }}
          REPORT_AGY_SESSION_REUSED: ${{ steps.agy.outputs.agy_session_reused }}
        shell: bash
        run: |
          cat > /tmp/autodev-test-verifier.mjs <<'VERIFY_EOF'
          import fs from 'fs';
          import { spawnSync } from 'child_process';

          const token = process.env.GH_TOKEN;
          const repo = process.env.REPORT_REPO;
          const actionsRunId = Number(process.env.REPORT_RUN_ID || 0);
          const branch = process.env.REPORT_BRANCH || 'main';
          const prNumber = process.env.REPORT_PR_NUM ? Number(process.env.REPORT_PR_NUM) : undefined;
          const pipelineRunId = process.env.REPORT_PIPELINE_ID || undefined;
          const channelBranch = process.env.REPORT_CHANNEL_BRANCH || 'autodev-plan-channel';

          const cases = [];
          const startedAll = Date.now();
          let kind = 'build_check';
          let rawLog = '';

          function runCheck(id, title, cmd, args) {
            const t0 = Date.now();
            const res = spawnSync(cmd, args, { encoding: 'utf8', timeout: 240000 });
            const durationMs = Date.now() - t0;
            const output = ((res.stdout || '') + '\n' + (res.stderr || '')).trim();
            rawLog += '\n=== ' + title + ' ===\n' + output.slice(-2000) + '\n';
            const passed = res.status === 0;
            cases.push({
              id,
              title,
              status: passed ? 'passed' : 'failed',
              durationMs,
              ...(passed ? {} : { error: output.slice(-400) || ('Exit code ' + res.status) }),
            });
            return { passed, output };
          }

          let pkg = null;
          try {
            if (fs.existsSync('package.json')) {
              pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            }
          } catch {}

          if (pkg && pkg.scripts) {
            if (pkg.scripts.typecheck || pkg.scripts.lint) {
              const sName = pkg.scripts.typecheck ? 'typecheck' : 'lint';
              runCheck('check-type', 'TypeScript / Lint 静态检查 (' + sName + ')', 'npm', ['run', sName]);
            }
            if (pkg.scripts.build) {
              runCheck('check-build', '生产构建检查 (npm run build)', 'npm', ['run', 'build']);
            }
            if (pkg.scripts.test && !String(pkg.scripts.test).includes('no test specified')) {
              kind = 'unit';
              runCheck('check-unit', '自动化单元测试 (npm test)', 'npm', ['test']);
            }
          }

          if (fs.existsSync('playwright.config.ts') || fs.existsSync('playwright.config.js')) {
            kind = 'e2e';
            const t0 = Date.now();
            const pw = spawnSync('npx', ['playwright', 'test', '--reporter=json'], {
              encoding: 'utf8',
              timeout: 300000,
            });
            const durationMs = Date.now() - t0;
            rawLog += '\n=== Playwright E2E ===\n' + ((pw.stderr || '') + '\n' + (pw.stdout || '')).slice(-2000);
            let parsedPw = null;
            try {
              const firstBrace = (pw.stdout || '').indexOf('{');
              if (firstBrace !== -1) parsedPw = JSON.parse(pw.stdout.slice(firstBrace));
            } catch {}
            if (parsedPw && Array.isArray(parsedPw.suites)) {
              const walk = (suite, prefix = '') => {
                const label = prefix ? prefix + ' › ' + (suite.title || '') : (suite.title || '');
                for (const spec of suite.specs || []) {
                  const testObj = (spec.tests || [])[0];
                  const lastResult = testObj && testObj.results ? testObj.results[testObj.results.length - 1] : null;
                  const st = lastResult?.status === 'passed' ? 'passed' : lastResult?.status === 'skipped' ? 'skipped' : 'failed';
                  cases.push({
                    id: 'pw-' + cases.length,
                    title: (label ? label + ' › ' : '') + (spec.title || 'E2E Case'),
                    file: spec.file,
                    status: st,
                    durationMs: Number(lastResult?.duration || 0),
                    ...(st === 'failed' ? { error: String(lastResult?.error?.message || 'Assertion failed').slice(0, 400) } : {}),
                  });
                }
                for (const child of suite.suites || []) walk(child, label);
              };
              for (const s of parsedPw.suites) walk(s);
            } else {
              cases.push({
                id: 'pw-suite',
                title: 'Playwright E2E 测试套件',
                status: pw.status === 0 ? 'passed' : 'failed',
                durationMs,
                ...(pw.status === 0 ? {} : { error: ((pw.stderr || '') + (pw.stdout || '')).slice(-400) }),
              });
            }
          }

          const passed = cases.filter((c) => c.status === 'passed').length;
          const failed = cases.filter((c) => c.status === 'failed').length;
          const skipped = cases.filter((c) => c.status === 'skipped').length;
          const total = cases.length;
          const status = failed > 0 && passed > 0 ? 'partial' : failed > 0 ? 'failed' : passed > 0 ? 'passed' : 'skipped';

          const agyExitRaw = process.env.REPORT_AGY_EXIT;
          const agyExitCode = agyExitRaw !== undefined && agyExitRaw !== '' ? Number(agyExitRaw) : undefined;
          const agySessionId = (process.env.REPORT_AGY_SESSION_ID || '').trim() || undefined;
          const agySessionReused = process.env.REPORT_AGY_SESSION_REUSED === 'true';

          const report = {
            runId: pipelineRunId,
            actionsRunId,
            actionsUrl: 'https://github.com/' + repo + '/actions/runs/' + actionsRunId,
            workflowName: 'AutoDev AGY Coding Runner',
            branch,
            prNumber,
            kind,
            status,
            total,
            passed,
            failed,
            skipped,
            durationMs: Date.now() - startedAll,
            executedAt: new Date().toISOString(),
            summary: '自动验证：' + passed + ' 通过 / ' + failed + ' 失败 / ' + skipped + ' 跳过',
            cases,
            rawLogExcerpt: rawLog.slice(-3000),
            ...(agySessionId ? { agySessionId } : {}),
            agySessionReused,
            ...(Number.isFinite(agyExitCode) ? { agyExitCode } : {}),
          };

          console.log('Structured test report summary:', report.summary);
          if (process.env.GITHUB_OUTPUT) {
            const allPassed = failed === 0 && passed > 0;
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              'all_passed=' + (allPassed ? 'true' : 'false') + '\n' +
              'passed_count=' + passed + '\n' +
              'failed_count=' + failed + '\n'
            );
          }

          if (token && repo && total > 0) {
            const headers = {
              Authorization: 'Bearer ' + token,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              Connection: 'close',
            };
            const targetPath = '.autodev-test-reports/' + actionsRunId + '.json';
            const encoded = targetPath.split('/').map(encodeURIComponent).join('/');
            const contentB64 = Buffer.from(JSON.stringify(report, null, 2), 'utf8').toString('base64');
            await fetch('https://api.github.com/repos/' + repo + '/contents/' + encoded, {
              method: 'PUT',
              headers,
              body: JSON.stringify({
                message: 'chore(autodev-test): publish structured test report for run ' + actionsRunId,
                content: contentB64,
                branch: channelBranch,
              }),
            }).catch((err) => console.warn('Failed to upload structured test report:', err));
          }
          VERIFY_EOF

          node /tmp/autodev-test-verifier.mjs || true
          rm -f /tmp/autodev-test-verifier.mjs

      - name: Evaluate AGY Exit & Verified Recovery Gate
        shell: bash
        run: |
          AGY_EXIT="${{ steps.agy.outputs.agy_exit }}"
          HAS_CHANGES="${{ steps.agy.outputs.has_changes }}"
          ALL_PASSED="${{ steps.verify.outputs.all_passed }}"
          if [ "${AGY_EXIT}" = "0" ]; then
            echo "AGY completed cleanly (exit 0)."
            exit 0
          fi
          if [ "${AGY_EXIT}" = "3" ] && [ "${HAS_CHANGES}" = "true" ] && [ "${ALL_PASSED}" = "true" ]; then
            echo "Verified recovery approved: AGY hit print_timeout (exit 3) after completing code changes, and 100% of automated verification checks passed (${{ steps.verify.outputs.passed_count }} passed, 0 failed)."
            exit 0
          fi
          echo "::error::AGY exited with code ${AGY_EXIT} and automated verification did not pass (has_changes=${HAS_CHANGES}, all_passed=${ALL_PASSED}, failed=${{ steps.verify.outputs.failed_count }})."
          exit 1

      - name: Commit & Push Implementation to Draft PR Branch
        id: push
        shell: bash
        run: |
          git config user.name "AutoDev AGY Runner"
          git config user.email "autodev-runner@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes produced by AGY."
          else
            COMMIT_SUFFIX=""
            if [ "${{ steps.agy.outputs.agy_exit }}" = "3" ]; then
              COMMIT_SUFFIX=" [verified recovery: ${{ steps.verify.outputs.passed_count }} checks passed]"
            fi
            git commit -m "feat(autodev): implement spec via VPS AGY (${{ steps.target.outputs.model }})${COMMIT_SUFFIX}"
            git push origin "HEAD:${{ steps.target.outputs.branch }}"
            SHA=$(git rev-parse --short HEAD)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Summary Comment on Draft PR
        if: steps.target.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ steps.push.outputs.changed }}" = "true" ]; then
            cat > /tmp/autodev-pr-summary.md <<'COMMENT_EOF'
          ### AutoDev VPS AGY 执行完成
          - Model: `${{ steps.target.outputs.model }}`
          - Commit: `${{ steps.push.outputs.commit_sha }}`
          - 全量只读测试契约（含历次回归测试）完整性校验通过，结构化测试报告已同步至控制面。
          - 请前往 AutoDev Studio「4. 验收与上线审批」或「5. 质量与自进化 (RSI)」查看测试结果并验收。
          COMMENT_EOF
          else
            cat > /tmp/autodev-pr-summary.md <<'COMMENT_EOF'
          ### AutoDev VPS AGY 执行结束
          - Model: `${{ steps.target.outputs.model }}`
          - 本次执行未产生新的文件变更，请查看 Actions 日志。
          COMMENT_EOF
          fi
          gh pr comment "${{ steps.target.outputs.pr_number }}" --body-file /tmp/autodev-pr-summary.md || true
          rm -f /tmp/autodev-pr-summary.md
